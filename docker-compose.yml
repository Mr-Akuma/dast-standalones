# ============================================================================
# DAST Standalone — Docker Compose for private EC2/internal usage
# ============================================================================
#
# Quick start:
#   copy .env.example .env and replace all secrets first
#   docker compose up                          # UI mode at http://localhost:5000
#   docker compose up test-target              # Start vulnerable test app
#   docker compose run scanner-headless        # Scan the test target
#
# Custom target:
#   TARGET_URL=https://staging.example.com docker compose run scanner-headless
#
# Full scan with all options:
#   docker compose run scanner-headless \
#     --target http://test-target:9999 \
#     --force-browse --ajax-spider \
#     --output /reports/full-scan.json \
#     --output-sarif /reports/full-scan.sarif
# ============================================================================

services:
  # ── PostgreSQL (prod database) ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-dast}
      POSTGRES_USER:     ${POSTGRES_USER:-dast}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dast-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dast} -d ${POSTGRES_DB:-dast}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── UI Mode (default) ────────────────────────────────────────────────────
  # Runs the Flask web UI on port 5000
  dast-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DAST_PORT:-5000}:5000"
    volumes:
      - ./reports:/reports
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dast}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dast}
      - REVELIO_SECRET=${REVELIO_SECRET:?Set REVELIO_SECRET in .env}
      - DAST_ADMIN_USER=${DAST_ADMIN_USER:?Set DAST_ADMIN_USER in .env}
      - DAST_ADMIN_PASSWORD_HASH=${DAST_ADMIN_PASSWORD_HASH:?Set DAST_ADMIN_PASSWORD_HASH in .env}
      - DAST_ALLOW_DEFAULT_LOGIN=0
      - DAST_CSRF_PROTECT=${DAST_CSRF_PROTECT:-1}
      - DAST_COOKIE_SAMESITE=${DAST_COOKIE_SAMESITE:-Strict}
      - DAST_COOKIE_SECURE=${DAST_COOKIE_SECURE:-0}
      - DAST_SESSION_HOURS=${DAST_SESSION_HOURS:-8}
      - DAST_LOGIN_MAX_ATTEMPTS=${DAST_LOGIN_MAX_ATTEMPTS:-5}
      - DAST_LOGIN_WINDOW_SECONDS=${DAST_LOGIN_WINDOW_SECONDS:-900}
    restart: unless-stopped
    networks:
      - dast-net
    depends_on:
      postgres:
        condition: service_healthy
      test-target:
        condition: service_started
        required: false

  # ── Headless Scanner ─────────────────────────────────────────────────────
  # One-shot scan against a target, writes reports to ./reports/
  scanner-headless:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["python3", "main.py", "--headless"]
    command:
      - "--target"
      - "${TARGET_URL:-http://test-target:9999}"
      - "--output"
      - "/reports/dast-report.json"
      - "--output-sarif"
      - "/reports/dast-report.sarif"
      - "--fail-on"
      - "${FAIL_ON:-high}"
    volumes:
      - ./reports:/reports
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dast}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-dast}
    networks:
      - dast-net
    depends_on:
      postgres:
        condition: service_healthy
      test-target:
        condition: service_started
        required: false
    profiles:
      - headless

  # ── Test Target (intentionally vulnerable) ───────────────────────────────
  # Minimal Flask app with XSS, info leaks, etc. for testing the scanner
  test-target:
    build:
      context: .
      dockerfile: Dockerfile.test-target
    ports:
      - "${TEST_PORT:-9999}:9999"
    networks:
      - dast-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - test
      - headless

networks:
  dast-net:
    driver: bridge

volumes:
  postgres-data:
