[pytest]
testpaths = tests
markers =
    passive: passive scanner tests
    dedup: dedup tests
    reporting: reporting tests
    config: configuration tests
    fuzzer: fuzzer and payload mutator tests
    scanner: VulnerabilityScanner method tests
    llm_scanner: LLMAppScanner detection and probe tests
    nuclei_tokens: nuclei token pattern detection tests
    auth: AuthHandler and module-level auth helper tests
    confidence: AuditIssueConfidence enum and ConfidenceScorer tests
    ranking: RequestRankingAlgorithm and rank_surfaces tests
    yaml_bcheck: YAMLRule and YAMLRuleEngine tests
    http_transform: HttpTransformation enum and apply_transformation tests
    findings_filter: _apply_findings_filter server-side filter helper tests
